packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts by default; allow only the ones we need.
allowBuilds:
  unrs-resolver: true # native resolver binding used by eslint-plugin-import-x
  '@parcel/watcher': false # ships prebuilt binaries; build script is only a fallback
  '@prisma/engines': true # downloads the schema engine used by prisma migrate
  prisma: true
  '@apollo/protobufjs': false # postinstall is informational only
  '@sentry/cli': true # downloads sentry-cli, used to upload source maps in EAS builds
